name: Build Jump Loot Fabric

on:
  push:
    branches: [ "fabric/1.20.1" ]
  pull_request:
    branches: [ "fabric/1.20.1" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Fabric mod
        run: gradle --no-daemon build

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: JumpLoot-Fabric-${{ github.sha }}
          path: build/libs/*-fabric.jar
          if-no-files-found: error
          retention-days: 14
